properties([
    parameters([
        string(
            name: 'EPIC_NAME',
            defaultValue: '',
            description: 'Use a Valid Jira Epic Number'
        ),

        [
            $class: 'ChoiceParameter',
            choiceType: 'PT_CHECKBOX',
            name: 'TARGET_SCOPE',
            description: 'Select UAT POC target servers',
            filterable: true,
            filterLength: 2,
            script: [
                $class: 'GroovyScript',
                fallbackScript: [
                    classpath: [],
                    sandbox: true,
                    script: 'return ["UAT"]'
                ],
                script: [
                    classpath: [],
                    sandbox: true,
                    script: 'return ["UAT"]'
                ]
            ]
        ],

        [
            $class: 'ChoiceParameter',
            choiceType: 'PT_CHECKBOX',
            name: 'PACKAGES_TO_BUILD',
            description: 'Select UAT packages to build and deploy',
            filterable: true,
            filterLength: 2,
            script: [
                $class: 'GroovyScript',
                fallbackScript: [
                    classpath: [],
                    sandbox: true,
                    script: 'return ["ERROR: Unable to load UAT packages"]'
                ],
                script: [
                    classpath: [],
                    sandbox: false,
                    script: '''
                        import groovy.json.JsonSlurper
                        import java.net.HttpURLConnection
                        import java.net.URLEncoder
                        import java.util.Base64
                        import jenkins.model.Jenkins
                        import com.cloudbees.plugins.credentials.CredentialsProvider
                        import com.cloudbees.plugins.credentials.common.StandardUsernamePasswordCredentials

                        def credentialId = 'Admin_Bitbucket'
                        def credential = CredentialsProvider.lookupCredentials(StandardUsernamePasswordCredentials, Jenkins.get(), null, null).find { it.id == credentialId }

                        if (!credential) {
                            return ["ERROR: Credential '${credentialId}' not found"]
                        }

                        def authentication = Base64.encoder.encodeToString("${credential.username}:${credential.password.plainText}".getBytes('UTF-8'))
                        def encodedBranch = URLEncoder.encode('refs/heads/UAT', 'UTF-8')
                        def apiUrl = 'https://bitbucket.tawn.com/rest/api/1.0/projects/EI/repos/webmethods-source-code/browse/IS' +
                                     "?at=${encodedBranch}&limit=1000"

                        HttpURLConnection connection =
                            (HttpURLConnection) new URL(apiUrl).openConnection()

                        connection.requestMethod = 'GET'
                        connection.connectTimeout = 10000
                        connection.readTimeout = 30000
                        connection.setRequestProperty('Authorization', "Basic ${authentication}")
                        connection.setRequestProperty('Accept', 'application/json')

                        try {
                            int responseCode = connection.responseCode

                            if (responseCode != 200) {
                                return ["ERROR: Bitbucket HTTP ${responseCode}"]
                            }

                            def response = new JsonSlurper().parse(connection.inputStream)

                            def packages = response.children.values
                                .findAll { it.type == 'DIRECTORY' }
                                .collect { it.path.name.toString() }
                                .findAll {
                                    it != 'Default' &&
                                    it != 'default' &&
                                    !it.startsWith('Wm') &&
                                    !it.startsWith('Wx')
                                }
                                .sort()

                            return packages ?: ["ERROR: No UAT packages found"]
                        } catch (Exception error) {
                            return ["ERROR: ${error.class.simpleName}: ${error.message}"]
                        } finally {
                            connection.disconnect()
                        }
                    '''
                ]
            ]
        ],

        [
            $class: 'DynamicReferenceParameter',
            name: 'SELECTION_SUMMARY',
            description: 'Live deployment selection',
            choiceType: 'ET_FORMATTED_HTML',
            referencedParameters: 'EPIC_NAME,TARGET_SCOPE,PACKAGES_TO_BUILD',
            omitValueField: true,
            script: [
                $class: 'GroovyScript',
                fallbackScript: [
                    classpath: [],
                    sandbox: true,
                    script: '''
                        return '<div style="color:#c0392b;"><b>Unable to display deployment selection</b></div>'
                    '''
                ],
                script: [
                    classpath: [],
                    sandbox: true,
                    script: '''
                        def escapeHtml = { value ->
                            value?.toString()
                                ?.replace('&', '&amp;')
                                ?.replace('<', '&lt;')
                                ?.replace('>', '&gt;')
                                ?.replace('"', '&quot;')
                                ?.replace("'", '&#39;')
                        }

                        def epic = EPIC_NAME?.toString()?.trim() ?: 'Not entered'
                        def target = TARGET_SCOPE?.toString()?.trim() ?: 'Not selected'

                        def packages = PACKAGES_TO_BUILD instanceof Collection
                            ? PACKAGES_TO_BUILD.collect { it.toString().trim() }.findAll { it }
                            : PACKAGES_TO_BUILD?.toString()?.split(',')?.collect { it.trim() }?.findAll { it } ?: []

                        def packageItems = packages
                            ? packages.collect { "<li style='color:#1f2937;'>${escapeHtml(it)}</li>" }.join('')
                            : "<li style='color:#c0392b;'>No packages selected</li>"

                        return """
                            <div style="padding:15px;border:1px solid #b8b8b8;border-radius:6px;background:#ffffff;color:#1f2937;">
                                <h3 style="margin:0 0 12px;color:#1f2937;">Deployment Selection</h3>
                                <p style="color:#1f2937;"><b>EPIC:</b> ${escapeHtml(epic)}</p>
                                <p style="color:#1f2937;"><b>Environment:</b> UAT</p>
                                <p style="color:#1f2937;"><b>Target:</b> ${escapeHtml(target)}</p>
                                <p style="color:#1f2937;"><b>Selected Packages:</b> ${packages.size()}</p>
                                <ul style="color:#1f2937;">${packageItems}</ul>
                            </div>
                        """
                    '''
                ]
            ]
        ]
    ])
])